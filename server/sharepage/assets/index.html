<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0A0A0A">
  <title>Onyx · Partage</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/share/assets/share.css">
  <script src="/share/assets/share.js" defer></script>
</head>
<body>
  <main id="landing" class="landing" aria-live="polite">
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <section class="card">
      <div class="poster" id="poster" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 4h2l2 3h3L9 4h2l2 3h3l-2-3h2l2 3h3V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9H4z"/></svg>
      </div>
      <div class="details">
        <p class="brand">Onyx · Partagé avec vous</p>
        <h1 id="title">Chargement…</h1>
        <p class="subtitle" id="subtitle" hidden></p>
        <ul class="badges" id="badges"></ul>

        <form id="password-form" class="password" hidden>
          <label for="password">Ce lien est protégé par un mot de passe.</label>
          <div class="row">
            <input id="password" type="password" autocomplete="off" required
                   placeholder="Mot de passe" maxlength="72">
            <button type="submit" class="primary">Déverrouiller</button>
          </div>
        </form>

        <button id="play" class="primary play" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <span id="play-label">Regarder</span>
        </button>

        <p class="message" id="message" role="alert" hidden></p>
      </div>
    </section>
  </main>

  <div id="player" class="player" hidden>
    <video id="video" playsinline preload="auto"></video>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <div class="chrome" id="chrome">
      <div class="top">
        <div>
          <p class="top-title" id="player-title"></p>
          <p class="top-subtitle" id="player-subtitle"></p>
        </div>
      </div>
      <p class="notice" id="notice" hidden></p>
      <div class="bottom">
        <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0"
               aria-label="Position de lecture">
        <div class="controls">
          <button id="toggle" type="button" class="icon" aria-label="Lecture">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path id="toggle-icon" d="M8 5.5v13l11-6.5z"/></svg>
          </button>
          <button id="back10" type="button" class="icon" aria-label="Reculer de 10 secondes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          </button>
          <button id="fwd10" type="button" class="icon" aria-label="Avancer de 10 secondes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg>
          </button>
          <span class="time" id="time">0:00 / 0:00</span>
          <span class="spacer"></span>
          <button id="mute" type="button" class="icon" aria-label="Couper le son">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path id="mute-icon" d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          </button>
          <button id="fullscreen" type="button" class="icon" aria-label="Plein écran">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 3v-3h2v5h-5v-2h3z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
