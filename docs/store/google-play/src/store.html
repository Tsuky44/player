<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Onyx · visuels Google Play</title>
<link rel="stylesheet" href="store.css">
</head>
<body>
<div id="root"></div>
<script>
  // Chaque visuel : un titre, une ligne, et un téléphone rendu dans Blender
  // (../renders, fond transparent) qui affiche les écrans d'Onyx
  // (screens.html). Les affiches qui sortent de l'écran sont celles des films
  // libres de la démo.
  const R = '../renders/';
  const BRAND = '../../../../brand/';

  const logo = `<div class="logo"><img src="${BRAND}onyx-mark.svg"><img class="word" src="${BRAND}onyx-wordmark.svg"></div>`;

  const phone = (title, sub, render, withLogo = false) => `<div class="canvas portrait">
      <div class="copy">${withLogo ? logo : ''}<h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><img class="render" src="${R}${render}.png"></div>`;

  // Un seul rendu par visuel : deux rendus superposés doubleraient leurs ombres.
  const tablet = (title, sub, render, withLogo = false) => `<div class="canvas tablet">
      <div class="copy">${withLogo ? logo : ''}<h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><img class="render" src="${R}${render}.png"></div>`;

  const SHOTS = {
    icon: { w: 512, h: 512, file: 'icone-512', html: () => `<img src="${BRAND}onyx-icon-square.svg" width="512" height="512">` },

    feature: { w: 1024, h: 500, file: 'image-presentation-1024x500', html: () => `<div class="canvas feature">
        <div class="copy">${logo}<h1>Ton cinéma privé.</h1><p>Tous tes médias, sur ton propre serveur.</p></div>
        <img class="render" src="${R}feature.png"></div>` },

    'phone-1': { w: 1080, h: 1920, file: 'telephone-1-accueil', html: () => phone('Ton cinéma privé.', 'Tous tes médias, sur ton propre serveur.', 'home', true) },
    'phone-2': { w: 1080, h: 1920, file: 'telephone-2-bibliotheque', html: () => phone('Toute ta collection,<br>à portée de main,<br>tout le temps.', '', 'films') },
    'phone-3': { w: 1080, h: 1920, file: 'telephone-3-fiche', html: () => phone('Chaque média,<br>en détail.', 'Résumé, casting, et la reprise là où tu t\'es arrêté.', 'detail') },
    'phone-4': { w: 1080, h: 1920, file: 'telephone-4-regarder-ensemble', html: () => phone('Le même média,<br>pas le même canapé.', 'Lecture et pause synchronisées pour tout le monde.', 'party') },
    'phone-5': { w: 1080, h: 1920, file: 'telephone-5-hors-ligne', html: () => phone('Tes médias hors ligne,<br>même sans connexion.', '', 'offline') },

    'tablet-1': { w: 2560, h: 1440, file: 'tablette-1-accueil', html: () => tablet('Ton cinéma privé.', 'Tous tes médias, sur ton propre serveur.', 'tablet-home', true) },
    'tablet-2': { w: 2560, h: 1440, file: 'tablette-2-fiche', html: () => tablet('Chaque média,<br>en détail.', 'Et la reprise là où tu t\'es arrêté.', 'tablet-detail') },
  };

  window.SHOTS = Object.fromEntries(Object.entries(SHOTS).map(([k, v]) => [k, { w: v.w, h: v.h, file: v.file }]));
  const id = location.hash.slice(1);
  if (SHOTS[id]) document.getElementById('root').innerHTML = SHOTS[id].html();
</script>
</body>
</html>
