<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Onyx · scènes de la vidéo</title>
<link rel="stylesheet" href="store.css">
<style>
  .scene { width: 1920px; height: 1080px; }
  .scene h1 { position: absolute; left: 110px; top: 50%; transform: translateY(-50%); width: 640px; font-size: 72px; }
  .scene .render { left: 0; top: 0; width: 1920px; height: 1080px; }
  .clear { background: transparent; }
  .logo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f5f5f7; }
  .logo .row { display: flex; align-items: center; gap: 6px; }
  .logo .row img { height: 190px; }
  .logo .row img.word { height: 70px; }
  .logo p { margin-top: 28px; font-size: 40px; font-weight: 600; color: #d1d1d6; }
  .end { color: #121414; }
  .end p { color: #5c5f66; }
  .end small { position: absolute; bottom: 70px; font-size: 22px; font-weight: 500; color: #8a8d93; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Images fixes de la vidéo, animées et enchaînées par render-video.cjs.
  const R = '../renders/';
  const BRAND = '../../../../brand/';
  const scene = (title, render) => `<div class="canvas scene"><h1>${title}</h1><img class="render" src="${R}${render}.png"></div>`;
  const mark = `<div class="row"><img src="${BRAND}onyx-mark.svg"><img class="word" src="${BRAND}onyx-wordmark.svg"></div>`;

  const SCENES = {
    intro: () => `<div class="scene clear"><div class="logo">${mark}<p>Ton cinéma privé.</p></div></div>`,
    home: () => scene('Ton cinéma<br>privé.', 'v-home'),
    films: () => scene('Toute ta collection.', 'v-films'),
    detail: () => scene('Chaque média,<br>en détail.', 'v-detail'),
    party: () => scene('Le même média,<br>pas le même canapé.', 'v-party'),
    offline: () => scene('Même hors ligne.', 'v-offline'),
    outro: () => `<div class="canvas scene"><div class="logo end">
        <div class="row"><img src="${BRAND}onyx-mark.svg" style="filter:invert(1) brightness(.12)"><img class="word" src="${BRAND}onyx-wordmark.svg" style="filter:invert(1) brightness(.12)"></div>
        <p>Ton cinéma privé.</p><small>Nécessite un serveur Onyx auto-hébergé. Onyx ne fournit aucun contenu.</small></div></div>`,
  };

  window.SCENES = Object.keys(SCENES);
  const id = location.hash.slice(1);
  if (SCENES[id]) document.getElementById('root').innerHTML = SCENES[id]();
</script>
</body>
</html>
