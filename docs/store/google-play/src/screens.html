<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Onyx · écrans pour les maquettes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
<style>
  /* Écrans d'Onyx redessinés d'après l'app (app/lib/theme, captures réelles),
     à 360 x 800 dp et 3x : 1080 x 2400 px, le format d'un téléphone actuel.
     Images : affiches et fonds TMDB des films libres, plans des films. */
  @font-face { font-family: Manrope; font-weight: 400; src: url(../../../../app/assets/fonts/Manrope-400.ttf); }
  @font-face { font-family: Manrope; font-weight: 500; src: url(../../../../app/assets/fonts/Manrope-500.ttf); }
  @font-face { font-family: Manrope; font-weight: 600; src: url(../../../../app/assets/fonts/Manrope-600.ttf); }
  @font-face { font-family: Manrope; font-weight: 700; src: url(../../../../app/assets/fonts/Manrope-700.ttf); }
  @font-face { font-family: Ph; src: url(../../../../app/assets/fonts/Phosphor-Regular.ttf); }
  @font-face { font-family: PhF; src: url(../../../../app/assets/fonts/Phosphor-Fill.ttf); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a0a0a; overflow: hidden; }
  body { font-family: Manrope, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased; }
  .scr { position: relative; width: 360px; height: 800px; overflow: hidden; background: #0a0a0a; }
  .land { width: 800px; height: 360px; }
  img { display: block; }
  .ph { font-family: Ph; font-style: normal; line-height: 1; }
  .phf { font-family: PhF; font-style: normal; line-height: 1; }
  .ms { font-family: 'Material Symbols Rounded'; font-style: normal; line-height: 1; font-variation-settings: 'FILL' 1; }

  .sb { position: absolute; z-index: 20; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 2px 20px 0 22px; font-size: 13.5px; font-weight: 600; }
  .sb .r { display: flex; gap: 6px; align-items: center; }

  .top { position: absolute; z-index: 15; top: 30px; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: linear-gradient(180deg, rgba(10,10,10,.6), rgba(10,10,10,.15)); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .32em; font-size: 15px; }
  .search { flex: 1; height: 34px; border-radius: 17px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13.5px; color: #8e8e93; background: rgba(40,40,42,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); backdrop-filter: blur(16px); }
  .search .ph { font-size: 16px; color: #a1a1a6; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: rgba(40,40,42,.8); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }

  .hero { position: absolute; top: 0; left: 0; right: 0; height: 500px; }
  .hero > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,.75) 0%, rgba(10,10,10,0) 22%, rgba(10,10,10,.15) 45%, rgba(10,10,10,.82) 80%, #0a0a0a 100%), linear-gradient(90deg, rgba(10,10,10,.55), rgba(10,10,10,0) 70%); }
  .hb { position: absolute; z-index: 5; left: 14px; right: 14px; top: 228px; }
  .kick { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; color: #c7c7cc; }
  .logo { height: 58px; max-width: 250px; object-fit: contain; object-position: left center; margin-top: 10px; }
  .year { font-size: 13px; color: #d1d1d6; margin-top: 12px; }
  .ov { font-size: 13px; line-height: 1.45; color: #c7c7cc; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 46px; padding: 0 22px; border-radius: 12px; background: #f5f5f7; color: #0a0a0a; font-weight: 600; font-size: 15px; }
  .btn .phf { font-size: 19px; }
  .ghost { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 12px; background: rgba(255,255,255,.14); font-weight: 600; font-size: 14px; margin-left: 8px; }
  .dots { display: flex; gap: 4px; margin-top: 18px; }
  .dots i { width: 6px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); }
  .dots i.on { width: 16px; background: #fff; }

  .sec { position: absolute; left: 14px; right: 0; }
  .sec h3 { font-size: 16.5px; font-weight: 600; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; }
  .card { position: relative; flex: none; width: 160px; height: 240px; border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .card .more { position: absolute; top: 9px; right: 9px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(30,30,30,.7); font-size: 16px; }
  .pg { height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
  .pg i { display: block; height: 100%; background: #0a84ff; }
  .card .pg { position: absolute; left: 10px; right: 10px; bottom: 10px; }

  .nav { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; height: 72px; display: flex; padding-top: 8px; background: rgba(16,16,17,.92); backdrop-filter: blur(24px); border-top: 1px solid rgba(255,255,255,.06); }
  .nav div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: #7c7c80; }
  .nav div .ph, .nav div .phf { font-size: 22px; }
  .nav div.on { color: #fff; font-weight: 600; }
  .bar { position: absolute; z-index: 21; left: 50%; bottom: 7px; width: 110px; height: 4px; margin-left: -55px; border-radius: 2px; background: rgba(255,255,255,.8); }

  /* fiche */
  .dhero { height: 360px; }
  .back { position: absolute; z-index: 16; top: 44px; left: 14px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(20,20,20,.55); font-size: 17px; }
  .db { position: absolute; z-index: 5; left: 14px; right: 14px; top: 212px; }
  .db .logo { height: 64px; max-width: 300px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13.5px; color: #d1d1d6; margin-top: 14px; }
  .meta .phf { color: #f5c518; font-size: 13px; margin-right: 3px; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 5px; font-size: 11px; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); }
  .wide { width: 100%; margin-top: 16px; }
  .remain { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 12.5px; color: #a1a1a6; }
  .remain .pg { flex: 1; }
  .acts { display: flex; gap: 12px; margin-top: 16px; }
  .acts span { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #1c1c1e; font-size: 19px; color: #d1d1d6; }
  .crew { display: flex; gap: 22px; margin-top: 22px; }
  .crew small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; color: #8e8e93; }
  .crew b { display: block; font-size: 14px; font-weight: 500; margin-top: 4px; }

  /* films */
  .ftop { position: absolute; z-index: 15; top: 34px; right: 14px; left: 120px; display: flex; gap: 10px; }
  .fhead { position: absolute; top: 96px; left: 14px; right: 14px; display: flex; align-items: baseline; gap: 10px; }
  .fhead h1 { font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  .fhead span { font-size: 14px; color: #8e8e93; }
  .fhead .sort { margin-left: auto; font-size: 14px; color: #c7c7cc; display: flex; align-items: center; gap: 4px; }
  .grid { position: absolute; top: 148px; left: 14px; right: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 12px; }
  .grid .card { width: 100%; height: auto; aspect-ratio: 2/3; }
  .grid b { display: block; font-size: 14px; font-weight: 500; margin-top: 8px; }
  .grid small { font-size: 12px; color: #8e8e93; }

  /* hors ligne */
  .dl { position: absolute; top: 96px; left: 14px; right: 14px; }
  .dl h1 { font-size: 27px; font-weight: 700; }
  .dl > small { display: block; font-size: 13px; color: #8e8e93; margin-top: 4px; }
  .dl h3 { font-size: 16px; font-weight: 600; margin: 26px 0 14px; }
  .it { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .it .th { position: relative; width: 112px; height: 63px; border-radius: 8px; overflow: hidden; flex: none; }
  .it .th img { width: 100%; height: 100%; object-fit: cover; }
  .it .th .pg { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 0; }
  .it .tx { flex: 1; min-width: 0; }
  .it b { display: block; font-size: 14.5px; font-weight: 500; }
  .it small { display: block; font-size: 12px; color: #8e8e93; margin-top: 3px; }
  .it .tx .pg { margin-top: 8px; }
  .it > .ph { font-size: 18px; color: #8e8e93; }

  /* lecteur */
  .land > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0) 26%, rgba(0,0,0,0) 50%, rgba(0,0,0,.75)); }
  .pt { position: absolute; top: 18px; left: 28px; right: 28px; display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 500; }
  .pt .ms { font-size: 22px; }
  .pt .lock { margin-left: auto; }
  .lum { position: absolute; right: 30px; top: 70px; width: 4px; height: 90px; border-radius: 2px; background: rgba(255,255,255,.25); }
  .lum i { position: absolute; left: 0; right: 0; bottom: 0; height: 80%; border-radius: 2px; background: #fff; }
  .pinfo { position: absolute; left: 28px; bottom: 120px; }
  .pinfo small { font-size: 12px; color: #c7c7cc; }
  .pinfo b { display: block; font-size: 26px; font-weight: 500; margin-top: 2px; }
  .picons { position: absolute; right: 26px; bottom: 128px; display: flex; gap: 22px; }
  .picons .ms { font-size: 23px; }
  .track { position: absolute; left: 28px; right: 28px; bottom: 96px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.28); }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #fff; }
  .track u { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.4); }
  .times { position: absolute; left: 28px; right: 28px; bottom: 70px; display: flex; justify-content: space-between; font-size: 12.5px; color: #e5e5ea; }
  .pctl { position: absolute; left: 22px; bottom: 22px; display: flex; gap: 34px; align-items: center; }
  .pctl .ms { font-size: 26px; }
  .pctl .ms.big { font-size: 32px; }
  .party { position: absolute; z-index: 5; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 330px; padding: 20px 22px; border-radius: 20px; background: rgba(28,28,30,.94); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .party .h { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
  .party .h .ph { color: #4aa3ff; font-size: 20px; }
  .party .h .x { margin-left: auto; color: #c7c7cc; }
  .party small { display: block; font-size: 12.5px; color: #a1a1a6; margin-top: 16px; }
  .party .code { display: flex; align-items: center; margin-top: 6px; font-size: 30px; font-weight: 700; letter-spacing: .14em; }
  .party .code span { margin-left: auto; font-size: 13.5px; letter-spacing: 0; font-weight: 500; color: #d1d1d6; display: flex; gap: 6px; align-items: center; }
  .party .p { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; }
  .party .p .avatar { width: 30px; height: 30px; font-size: 12px; }
  .party .p em { font-style: normal; margin-left: auto; font-size: 12.5px; color: #4aa3ff; }
  .party .p .ok { margin-left: auto; color: #30d158; font-size: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const IMG = 'img/';
  const ph = (cp, fill = false) => `<i class="${fill ? 'phf' : 'ph'}">&#x${cp};</i>`;
  const ms = (name, cls = '') => `<i class="ms ${cls}">${name}</i>`;
  const mark = (h) => `<svg width="${h}" height="${h}" viewBox="26 120 272 272"><circle cx="162" cy="256" r="130" fill="#0e1010" stroke="#e8e6e4" stroke-width="14"/><path d="M 122 191 L 122 321 L 227 256 Z" fill="#e8e6e4"/></svg>`;

  const status = () => `<div class="sb"><span>21:42</span><span class="r">
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 12 0 3.2A11.7 11.7 0 0 1 16 3.2Z" fill="#fff"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12"><rect x=".5" y=".5" width="20" height="11" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#fff"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="#fff" opacity=".5"/></svg></span></div>`;

  const topBar = () => `<div class="top"><span class="brand">${mark(26)}ONYX</span>
      <span class="search">${ph('e30c')}Rechercher</span><span class="avatar">C</span></div>`;

  const nav = (on) => `<div class="nav">${[['e2c2', 'Accueil'], ['e792', 'Films'], ['e5f0', 'Listes'], ['e20c', 'Hors ligne']]
      .map(([cp, l]) => `<div class="${l === on ? 'on' : ''}">${ph(cp, l === on)}<span>${l}</span></div>`).join('')}</div><i class="bar"></i>`;

  const card = (slug, p) => `<div class="card"><img src="${IMG}${slug}-poster.jpg"><span class="more">${ph('e1fe')}</span>${p ? `<div class="pg"><i style="width:${p * 100}%"></i></div>` : ''}</div>`;

  const SCREENS = {
    home: () => `<div class="scr">${status()}${topBar()}
      <div class="hero"><img class="bg" src="${IMG}tears-of-steel-backdrop.jpg" style="object-position:38% 50%">
        <div class="hb"><div class="kick">FILM</div><img class="logo" src="${IMG}tears-of-steel-logo.png">
          <div class="year">2012</div>
          <div class="ov">Dans un futur apocalyptique, à Amsterdam aux Pays-Bas, un groupe de soldats et de scientifiques tente de changer le cours de la guerre.</div>
          <div style="margin-top:18px"><span class="btn">${ph('e3d0', true)}Reprendre</span></div>
          <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
      <div class="sec" style="top:520px"><h3>Reprendre la lecture</h3>
        <div class="row">${card('meridian', 0.56)}${card('sintel', 0.25)}${card('sprite-fright', 0.4)}</div></div>
      ${nav('Accueil')}</div>`,

    detail: () => `<div class="scr">${status()}<span class="back">${ph('e138')}</span>
      <div class="hero dhero"><img class="bg" src="${IMG}still-meridian-251.jpg" style="object-position:55% 30%"></div>
      <div class="db"><div class="kick">FILM</div><img class="logo" src="${IMG}meridian-logo.png">
        <div class="meta"><span>2016</span>·<span>12 min</span>·<span>${ph('e46a', true)}4,8</span>·<span>Mystère, Science-Fiction</span></div>
        <div style="margin-top:8px"><span class="badge">4K</span> <span class="badge">HDR</span></div>
        <div class="ov" style="-webkit-line-clamp:4">1947, sur la côte californienne. Des hommes disparaissent les uns après les autres près d'une falaise battue par l'orage. Deux inspecteurs mènent l'enquête, et une mystérieuse femme en blanc semble en savoir bien plus qu'eux.</div>
        <span class="btn wide">${ph('e3d0', true)}Reprendre</span>
        <div class="remain"><div class="pg"><i style="width:56%"></i></div><span>5 min restantes</span></div>
        <div class="acts"><span>${ph('e184')}</span><span>${ph('e0ea')}</span><span>${ph('e20c')}</span><span>${ph('e2e2')}</span></div>
        <div class="crew"><div><small>RÉALISATION</small><b>Curtis Clark</b></div><div><small>SCÉNARIO</small><b>Curtis Clark</b></div><div><small>STUDIO</small><b>Netflix</b></div></div></div>
      ${nav('Films')}</div>`,

    films: () => `<div class="scr">${status()}
      <div class="ftop"><span class="search">${ph('e30c')}Rechercher</span><span class="avatar">C</span></div>
      <div class="fhead"><h1>Films</h1><span>7 titres</span><span class="sort">Récents ${ph('e140')}</span></div>
      <div class="grid">${[['meridian', 'Meridian', 2016, 0.56], ['tears-of-steel', 'Tears of Steel', 2012, 0.7], ['charge', 'Charge', 2022], ['spring', 'Spring', 2019], ['sintel', 'Sintel', 2010], ['cosmos-laundromat', 'Cosmos Laundromat', 2015]]
        .map(([s, t, y, p]) => `<div><div class="card"><img src="${IMG}${s}-poster.jpg">${p ? `<div class="pg"><i style="width:${p * 100}%"></i></div>` : ''}</div><b>${t}</b><small>${y}</small></div>`).join('')}</div>
      ${nav('Films')}</div>`,

    offline: () => `<div class="scr">${status()}
      <div class="ftop"><span class="search">${ph('e30c')}Rechercher</span><span class="avatar">C</span></div>
      <div class="dl"><h1>Téléchargements</h1><small>5 éléments · 1,1 Go</small><h3>Films</h3>
        ${[['meridian', 'Meridian', '42 % visionné · 127 Mo', 0.42], ['tears-of-steel', 'Tears of Steel', '75 % visionné · 425 Mo', 0.75], ['cosmos-laundromat', 'Cosmos Laundromat', '145 Mo sur 292 Mo', null, 0.5], ['spring', 'Spring', '134 Mo'], ['charge', 'Charge', '84 Mo']]
          .map(([s, t, sub, w, d]) => `<div class="it"><div class="th"><img src="${IMG}${s}-backdrop.jpg">${w ? `<div class="pg"><i style="width:${w * 100}%"></i></div>` : ''}</div>
            <div class="tx"><b>${t}</b><small>${sub}</small>${d ? `<div class="pg"><i style="width:${d * 100}%"></i></div>` : ''}</div>${ph('e208')}</div>`).join('')}</div>
      ${nav('Hors ligne')}</div>`,

    player: () => `<div class="scr land"><img class="bg" src="${IMG}still-meridian-294.jpg"><div class="shade"></div>
      <div class="pt">${ms('arrow_back_ios_new')}<span>Meridian</span><span class="lock">${ms('lock_open')}</span></div>
      <div class="lum"><i></i></div>
      <div class="pinfo"><small>2016</small><b>Meridian</b></div>
      <div class="picons">${['closed_caption', 'graphic_eq', 'speed', 'group_add', 'settings', 'fullscreen'].map((n) => ms(n)).join('')}</div>
      <div class="track"><u style="width:68%"></u><i style="width:61%"></i></div>
      <div class="times"><span>04:48</span><span>-03:05 / 07:53</span></div>
      <div class="pctl">${ms('replay_10')}${ms('pause', 'big')}${ms('forward_10')}</div></div>`,

    party: () => `<div class="scr land"><img class="bg" src="${IMG}still-tos-516.jpg"><div class="shade" style="background:rgba(0,0,0,.45)"></div>
      <div class="party"><div class="h">${ph('e68e')}<span>Regarder ensemble</span><span class="x">${ph('e4f6')}</span></div>
        <small>Code de la séance</small><div class="code">4GJ9EV<span>${ms('content_copy')}Copier</span></div>
        <div class="p"><span class="avatar">C</span>Camille (vous)<em>Hôte</em></div>
        <div class="p"><span class="avatar" style="background:#2c5282">L</span>Léa<i class="ph ok">&#xe184;</i></div>
        <div class="p"><span class="avatar" style="background:#6b3f8f">H</span>Hugo<i class="ph ok">&#xe184;</i></div></div></div>`,
  };

  window.SCREENS = Object.keys(SCREENS);
  const id = location.hash.slice(1);
  if (SCREENS[id]) document.getElementById('root').innerHTML = SCREENS[id]();
</script>
</body>
</html>
