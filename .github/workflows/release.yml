name: Release

# Publie une version complete d'Onyx : les installateurs clients (Windows,
# macOS, Android, iOS, Apple TV, lanceur LG webOS), le bundle web, et l'image Docker qui embarque
# le tout.
#
# Ce workflow remplace publish-image.sh. Le script local doit recuperer les
# artefacts de l'image precedente parce qu'un Mac ne produit jamais l'EXE
# Windows ; ici les trois plateformes sont construites en parallele sur leur
# propre runner, donc chaque publication repart d'artefacts frais.
#
# Declenchement :
#   - Actions -> Release -> Run workflow, en choisissant patch / minor / major :
#     la version est calculee a partir du dernier tag vX.Y.Z, et le tag est cree
#     par la GitHub Release. Rien a taper, rien a retenir.
#   - en ligne de commande : `gh workflow run release.yml -f bump=patch`
#   - ou, comme avant, `git tag v1.0.1 && git push origin v1.0.1`
#
# Lance a la main, chaque plateforme se coche ou se decoche : un correctif qui
# ne touche que LG ne doit pas faire mettre a jour les postes Windows. Une
# plateforme non reconstruite reprend dans la nouvelle Release l'installateur
# deja publie, sous son nom d'origine (Onyx-1.0.40-android.apk dans la Release
# v1.0.41) : le serveur lit la version dans le nom du fichier, donc une app en
# 1.0.40 n'y voit pas de mise a jour. Un tag pousse reconstruit tout.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Increment par rapport au dernier tag"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Version explicite, sans le v (optionnel, ignore le bump)"
        required: false
        type: string
      android:
        description: "Android (APK + App Bundle Play)"
        type: boolean
        default: true
      windows:
        description: "Windows (installeur + ZIP de mise a jour)"
        type: boolean
        default: true
      macos:
        description: "macOS (DMG)"
        type: boolean
        default: true
      ios:
        description: "iOS (IPA + TestFlight)"
        type: boolean
        default: true
      tvos:
        description: "Apple TV (IPA + TestFlight)"
        type: boolean
        default: true
      webos:
        description: "Lanceur LG webOS (.ipk)"
        type: boolean
        default: true

# Deux publications simultanees calculeraient la meme version a partir du meme
# dernier tag : la seconde attend la fin de la premiere.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # creer la GitHub Release
  packages: write # pousser sur ghcr.io

env:
  # Epinglee : une montee de version de Flutter doit etre un changement
  # deliberat et teste, pas une surprise au milieu d'une publication.
  FLUTTER_VERSION: "3.44.2"
  IMAGE_NAME: playeur-server

jobs:
  # ---------------------------------------------------------------------------
  # Resout la version une seule fois, pour que tous les jobs suivants nomment
  # leurs artefacts de facon identique.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      minor_tag: ${{ steps.resolve.outputs.minor_tag }}
      image: ${{ steps.resolve.outputs.image }}
      # Tableau JSON des plateformes a reconstruire, ex. ["android","webos"].
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      # Historique complet : sans les tags, impossible de trouver la derniere
      # version publiee.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        env:
          # Passe par l'environnement plutot que par une interpolation dans le
          # corps du script : une saisie manuelle ne doit jamais pouvoir devenir
          # du shell.
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_INPUT: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          BUILD_ANDROID: ${{ inputs.android }}
          BUILD_WINDOWS: ${{ inputs.windows }}
          BUILD_MACOS: ${{ inputs.macos }}
          BUILD_IOS: ${{ inputs.ios }}
          BUILD_TVOS: ${{ inputs.tvos }}
          BUILD_WEBOS: ${{ inputs.webos }}
        run: |
          set -euo pipefail

          # Tri semantique (-v:refname) : un tri alphabetique placerait v1.0.9
          # apres v1.0.34.
          LATEST="$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          LATEST="${LATEST#v}"
          echo "Dernier tag : ${LATEST:-aucun}"

          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          elif [ -n "${VERSION_INPUT// /}" ]; then
            VERSION="${VERSION_INPUT#v}"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
            case "$BUMP_INPUT" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version invalide : '$VERSION' (format attendu : X.Y.Z)"
            exit 1
          fi

          # Lance a la main, le tag ne doit pas encore exister : sinon la Release
          # ecraserait silencieusement les installateurs d'une version publiee.
          if [ "$EVENT_NAME" != "push" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Le tag v$VERSION existe deja. Choisissez un autre bump ou une version explicite."
            exit 1
          fi

          # ghcr.io n'accepte que des minuscules, la casse du proprietaire
          # GitHub est libre.
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"

          # Un tag pousse n'a pas de cases a cocher : il reconstruit tout.
          BUILDS=()
          for p in android windows macos ios tvos webos; do
            var="BUILD_$(printf '%s' "$p" | tr '[:lower:]' '[:upper:]')"
            if [ "$EVENT_NAME" = "push" ] || [ "${!var:-}" = "true" ]; then
              BUILDS+=("\"$p\"")
            fi
          done
          BUILDS_JSON="[$(IFS=,; printf '%s' "${BUILDS[*]:-}")]"

          {
            echo "version=$VERSION"
            echo "version_tag=v$VERSION"
            echo "minor_tag=v$(printf '%s' "$VERSION" | cut -d. -f1,2)"
            echo "image=ghcr.io/$OWNER_LC/$IMAGE_NAME"
            echo "builds=$BUILDS_JSON"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Onyx $VERSION (precedente : ${LATEST:-aucune})"
            echo ""
            echo "Plateformes reconstruites : \`$BUILDS_JSON\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Android — APK
  # ---------------------------------------------------------------------------
  build-android:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.builds), 'android')
    runs-on: ubuntu-latest
    env:
      # Au niveau du job : un `if` d'etape ne lit pas directement les secrets.
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Sans keystore fourni, Gradle en fabrique un a la volee — et comme le
      # runner est jetable, il serait different a chaque publication. Android
      # refuse alors la mise a jour d'un APK par un APK signe d'une autre cle :
      # les utilisateurs devraient desinstaller avant chaque version.
      - name: Installer la cle de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 absent — APK signe avec la cle de debug. Il s'installe, mais ne pourra pas mettre a jour une version precedente. Voir docs/release-ci.md."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/android/onyx-release.jks
          cat > app/android/key.properties <<EOF
          storeFile=onyx-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Keystore de release installe."

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Nommer l'artefact
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "out/Onyx-${VERSION}-android.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: out/*.apk
          retention-days: 7
          if-no-files-found: error

      # Google Play ne prend qu'un App Bundle, et refuse une app qui se met a
      # jour hors de chez lui : STORE_BUILD coupe la mise a jour maison et
      # retire REQUEST_INSTALL_PACKAGES du manifeste (ADR-0046). L'artefact ne
      # s'appelle pas installer-* : il n'a rien a faire sur /api/downloads ni
      # dans la Release, il se depose a la main dans la Play Console.
      - name: Build App Bundle (Google Play)
        working-directory: app
        run: |
          flutter build appbundle --release \
            --dart-define=STORE_BUILD=true \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: store-android
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # Depose le bundle sur la piste Tests internes : la version arrive chez
      # les testeurs sans passer par la Play Console. Sans le secret (fork,
      # compte de service pas encore cree), l'etape est sautee et l'AAB reste
      # disponible en artefact.
      - name: Envoyer sur le test interne Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tsuky.onyx
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # ---------------------------------------------------------------------------
  # macOS — DMG
  # ---------------------------------------------------------------------------
  build-macos:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.builds), 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # --build-name doit correspondre a la version du nom d'artefact : c'est ce
      # que PackageInfo.fromPlatform() rapporte au client installe, et c'est
      # contre cette valeur que l'auto-updater compare la version publiee.
      # Android et iOS le passent deja ; l'oublier ici veut dire que l'app
      # tournante croit toujours etre en version pubspec.yaml (1.0.0, jamais
      # remontee), quelle que soit la version reellement publiee.
      - name: Build macOS
        working-directory: app
        run: |
          flutter build macos --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      # Meme empaquetage que scripts/build-releases.sh : le .app renomme, plus
      # un lien vers /Applications pour que le glisser-deposer soit evident a
      # l'ouverture du volume.
      # La signature (.onyx-update.sig, a cote de l'app) est ce que l'app
      # installee exige avant de se remplacer : sans elle, les Mac deja
      # installes refusent la mise a jour automatique. Meme cle que Windows.
      - name: Packager le DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ONYX_UPDATE_SIGNING_KEY: ${{ secrets.ONYX_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          APP_BUNDLE="$(find app/build/macos -maxdepth 5 -name '*.app' -type d | head -1)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::Bundle .app introuvable apres le build"
            exit 1
          fi

          STAGE="$(mktemp -d)"
          cp -R "$APP_BUNDLE" "$STAGE/Onyx.app"
          if [ -n "$ONYX_UPDATE_SIGNING_KEY" ]; then
            sh scripts/sign-macos-update.sh "$STAGE/Onyx.app" "$VERSION" "$STAGE/.onyx-update.sig"
          else
            echo "::warning::ONYX_UPDATE_SIGNING_KEY absent — DMG non signe : les Mac deja installes refuseront cette mise a jour."
          fi
          ln -sf /Applications "$STAGE/Applications"

          mkdir -p out
          hdiutil create \
            -volname "Onyx ${VERSION}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "out/Onyx-${VERSION}-macos.dmg"
          rm -rf "$STAGE"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: out/*.dmg
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS — IPA non signe (sideloading) + TestFlight
  # ---------------------------------------------------------------------------
  # Meme sortie que `scripts/build-ios-ipa.sh` sans --signed : le .ipa est
  # resigne a l'installation par Sideloadly ou AltStore.
  #
  # TestFlight : les etapes dediees ne tournent que si la cle API App Store
  # Connect est configuree (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, voir
  # scripts/ci/testflight-upload.sh). Sans elle, le job fait exactement ce
  # qu'il faisait avant. Un echec d'envoi ne bloque pas la Release : l'etape
  # apparait en echec dans l'onglet Actions et le resume du run le signale.
  build-ios:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.builds), 'ios')
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build iOS
        working-directory: app
        env:
          # CocoaPods refuse de tourner sous une locale non UTF-8, et c'est le
          # build Flutter qui lance `pod install`.
          LANG: en_US.UTF-8
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      # Un .ipa n'est qu'un zip contenant `Payload/Runner.app`.
      - name: Packager l'IPA
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          APP_BUNDLE="app/build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "::error::Runner.app introuvable dans app/build/ios/iphoneos/"
            exit 1
          fi

          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_BUNDLE" "$STAGE/Payload/"
          # La signature ad-hoc residuelle fait parfois echouer la resignature
          # par l'outil de sideloading.
          rm -rf "$STAGE/Payload/Runner.app/_CodeSignature"

          mkdir -p out
          OUT="$PWD/out/Onyx-${VERSION}-ios.ipa"
          (cd "$STAGE" && zip -qry "$OUT" Payload)
          rm -rf "$STAGE"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: installer-ios
          path: out/*.ipa
          retention-days: 7
          if-no-files-found: error

      # Build store (ADR-0046) : l'archive qui part chez Apple ne propose pas
      # d'installeurs. L'IPA de sideloading, plus haut, reste complet.
      # TestFlight veut une archive Xcode, pas un .app. Elle reste non signee :
      # la signature se fait a l'export. run_number ne fait que croitre, ce
      # qu'exige TestFlight pour les builds d'une meme version.
      - name: Archiver pour TestFlight
        id: ios-archive
        if: env.ASC_KEY_ID != ''
        continue-on-error: true
        working-directory: app
        env:
          LANG: en_US.UTF-8
        run: |
          flutter build ipa --release --no-codesign \
            --dart-define=STORE_BUILD=true \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Envoyer sur TestFlight
        if: env.ASC_KEY_ID != '' && steps.ios-archive.outcome == 'success'
        continue-on-error: true
        run: |
          if bash scripts/ci/testflight-upload.sh app/build/ios/archive/Runner.xcarchive; then
            echo "TestFlight iOS : build ${{ github.run_number }} envoye, disponible apres le traitement Apple (10 a 30 min)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Envoi TestFlight iOS en echec, voir le log de l'etape."
            echo "TestFlight iOS : envoi en ECHEC." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Apple TV (tvOS) — IPA non signe + TestFlight
  # ---------------------------------------------------------------------------
  # Flutter ne cible pas tvOS : le build passe par flutter-tvos (ADR-0028), qui
  # apporte son propre moteur et son propre Flutter, epingle sur la meme ligne
  # 3.44 que le reste. Meme sortie que `scripts/build-tvos-ipa.sh` sans
  # --signed. TestFlight : memes conditions que pour iOS ; l'app tvOS partage
  # le bundle ID de l'iPhone, donc la meme fiche App Store Connect.
  #
  # continue-on-error : cette cible s'appuie sur un outillage communautaire. Un
  # echec ici ne doit pas priver les autres plateformes de leur publication —
  # la Release part simplement sans l'IPA Apple TV.
  build-tvos:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.builds), 'tvos')
    runs-on: macos-latest
    continue-on-error: true
    env:
      FLUTTER_TVOS_VERSION: v3.44.9-tvos.1.5.1
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      # Le SDK tvOS n'est pas toujours installe avec Xcode sur les images
      # GitHub : sans lui, xcodebuild ne trouve aucune destination.
      - name: Plateforme tvOS
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q appletvos; then
            xcodebuild -downloadPlatform tvOS
          fi
          xcodebuild -showsdks | grep appletv

      - name: Installer flutter-tvos
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_TVOS_VERSION" \
            https://github.com/fluttertv/flutter-tvos.git "$RUNNER_TEMP/flutter-tvos"
          echo "$RUNNER_TEMP/flutter-tvos/bin" >> "$GITHUB_PATH"

      - name: flutter-tvos precache
        run: flutter-tvos precache

      # Ce tag de flutter-tvos n'a pas de --no-codesign : il passe toujours a
      # xcodebuild l'equipe du projet et -allowProvisioningUpdates, ce qui
      # echoue sur un runner sans compte Apple. XCODE_XCCONFIG_FILE impose des
      # reglages a toutes les cibles (Runner et Pods) par-dessus le projet : la
      # signature y est coupee, comme le ferait --no-codesign. Les phases
      # d'embarquement du projet sautent deja la signature dans ce cas.
      - name: Build tvOS
        working-directory: app
        env:
          LANG: en_US.UTF-8
        run: |
          set -euo pipefail
          XCCONFIG="$RUNNER_TEMP/no-codesign.xcconfig"
          printf '%s\n' \
            'CODE_SIGNING_ALLOWED = NO' \
            'CODE_SIGNING_REQUIRED = NO' \
            'CODE_SIGN_IDENTITY =' \
            'EXPANDED_CODE_SIGN_IDENTITY =' > "$XCCONFIG"
          export XCODE_XCCONFIG_FILE="$XCCONFIG"
          flutter-tvos build tvos --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Packager l'IPA
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          APP_BUNDLE="app/build/tvos/Release-appletvos/Runner.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "::error::Runner.app introuvable dans app/build/tvos/Release-appletvos/"
            exit 1
          fi

          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_BUNDLE" "$STAGE/Payload/"
          rm -rf "$STAGE/Payload/Runner.app/_CodeSignature"

          # Le suffixe -tvos est ce qui distingue cet .ipa de celui de l'iPhone
          # pour le serveur (handlers/downloads.go).
          mkdir -p out
          OUT="$PWD/out/Onyx-${VERSION}-tvos.ipa"
          (cd "$STAGE" && zip -qry "$OUT" Payload)
          rm -rf "$STAGE"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: installer-tvos
          path: out/*.ipa
          retention-days: 7
          if-no-files-found: error

      # flutter-tvos ne sait pas archiver : on archive le projet Xcode que son
      # build vient de preparer (Generated.xcconfig porte deja version et
      # numero de build), toujours sans signature, par le meme xcconfig.
      - name: Archiver pour TestFlight
        id: tvos-archive
        if: env.ASC_KEY_ID != ''
        continue-on-error: true
        working-directory: app/tvos
        env:
          LANG: en_US.UTF-8
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/no-codesign.xcconfig
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath ../build/tvos/archive/Runner.xcarchive

      - name: Envoyer sur TestFlight
        if: env.ASC_KEY_ID != '' && steps.tvos-archive.outcome == 'success'
        continue-on-error: true
        run: |
          if bash scripts/ci/testflight-upload.sh app/build/tvos/archive/Runner.xcarchive; then
            echo "TestFlight Apple TV : build ${{ github.run_number }} envoye, disponible apres le traitement Apple (10 a 30 min)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Envoi TestFlight Apple TV en echec, voir le log de l'etape."
            echo "TestFlight Apple TV : envoi en ECHEC." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Windows — EXE (installeur Inno Setup) + ZIP portable
  # ---------------------------------------------------------------------------
  build-windows:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.builds), 'windows')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Win32 plafonne les chemins a 260 caracteres, et git abandonne le
      # checkout des qu'un fichier depasse. Les chemins profonds sont faciles a
      # reintroduire (un plugin Flutter, un dossier de build) et l'echec est
      # alors total et immediat : ce reglage evite d'y revenir.
      - name: Autoriser les chemins longs
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # Meme raison que le build macOS ci-dessus : sans --build-name, l'exe
      # compile lit la version figee de pubspec.yaml au lieu de celle du tag
      # publie, et PackageInfo.fromPlatform() ment au client sur sa propre
      # version — l'auto-updater compare alors contre une base fausse.
      - name: Build Windows
        working-directory: app
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          flutter build windows --release `
            --build-name="${{ needs.prepare.outputs.version }}" `
            --build-number="${{ github.run_number }}"

      - name: Construire l'installeur Inno Setup
        working-directory: app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup absent de l'image du runner — installation."
            choco install innosetup -y --no-progress
          }
          # /D alimente le #define de installer.iss, /F impose le nom de sortie.
          & $iscc "/DAppVersion=$env:VERSION" "/FOnyx-$env:VERSION-windows" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC a echoue ($LASTEXITCODE)" }

      - name: Rassembler les artefacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "app\Output\Onyx-$env:VERSION-windows.exe" "out\"
          # Le ZIP portable depanne les postes ou l'installeur ne peut pas
          # s'executer (droits admin refuses, politique d'entreprise).
          Compress-Archive `
            -Path "app\build\windows\x64\runner\Release\*" `
            -DestinationPath "out\Onyx-$env:VERSION-windows-portable.zip" -Force
          Get-ChildItem out

      # Le ZIP portable est aussi le paquet de mise a jour : onyx-updater.exe
      # ne l'applique que signe par cette cle (ADR-0030). Sans elle, les postes
      # Windows deja installes restent sur leur version.
      - name: Signer la mise a jour Windows
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ONYX_UPDATE_SIGNING_KEY: ${{ secrets.ONYX_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:ONYX_UPDATE_SIGNING_KEY) {
            Write-Host "::warning::ONYX_UPDATE_SIGNING_KEY absent — ZIP Windows non signe : les installations existantes refuseront cette mise a jour. Voir docs/release-ci.md."
            exit 0
          }
          & scripts\sign-windows-update.ps1 `
            -Zip "out\Onyx-$env:VERSION-windows-portable.zip" `
            -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            out/*.exe
            out/*.zip
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tests : en parallele des builds, mais rien n'est publie s'ils sont rouges.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Televiseurs LG — lanceur webOS (.ipk)
  # ---------------------------------------------------------------------------
  # Le paquet ne contient que app/webos/, la page qui ouvre l'app web du serveur
  # (ADR-0076) : ni Flutter ni secret ici, quelques secondes de build. Il n'est
  # pas signe — LG ne signe que ce qui passe par son Content Store, et une
  # installation en mode developpeur accepte un paquet non signe.
  build-webos:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.builds), 'webos')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Epinglee, comme Flutter : ares-package decide du format du paquet.
      - name: Installer les outils webOS
        run: npm install -g @webos-tools/cli@3.2.6

      - name: Build du .ipk
        env:
          ONYX_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/build-webos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installer-webos
          path: app/build/webos/*.ipk
          retention-days: 7
          if-no-files-found: error

  test:
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Bundle web + image Docker + GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    needs: [prepare, test, build-android, build-macos, build-ios, build-tvos, build-windows, build-webos]
    # Un job decoche est « skipped », ce qui suffirait a sauter celui-ci par
    # defaut : on accepte donc skipped, mais toujours pas un echec. Apple TV
    # reste a part (continue-on-error) : en echec, son IPA precedent est repris.
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && needs.test.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.build-android.result)
      && contains(fromJSON('["success","skipped"]'), needs.build-macos.result)
      && contains(fromJSON('["success","skipped"]'), needs.build-ios.result)
      && contains(fromJSON('["success","skipped"]'), needs.build-windows.result)
      && contains(fromJSON('["success","skipped"]'), needs.build-webos.result)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Les installateurs ne vont plus dans l'image (ADR-0062) : ils sont joints
      # a la Release ci-dessous, et le serveur de cette version va les y chercher
      # (server/releasedl).
      - name: Recuperer les installateurs
        if: needs.prepare.outputs.builds != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets

      # Chaque Release porte un installateur par plateforme : un serveur ne lit
      # que celle de sa version (ADR-0062). Ce qui n'a pas ete reconstruit est
      # donc repris de la Release la plus recente qui l'a, sans le renommer :
      # la version du nom reste celle du build, et c'est elle que l'app compare
      # a la sienne. Le ZIP Windows garde aussi sa signature, liee a sa version.
      - name: Reprendre les installateurs non reconstruits
        id: carry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh api "repos/$REPO/releases?per_page=50" > "$RUNNER_TEMP/releases.json"

          CARRIED=""
          # -ios.ipa ne recouvre pas -tvos.ipa : le tiret fait partie du suffixe.
          for suffix in android.apk windows.exe windows-portable.zip macos.dmg ios.ipa tvos.ipa webos.ipk; do
            if compgen -G "release-assets/Onyx-*-$suffix" > /dev/null; then
              continue
            fi
            # L'API rend les Releases de la plus recente a la plus ancienne.
            found="$(jq -r --arg s "-$suffix" '
              [ .[] | select((.draft or .prerelease) | not) | . as $r
                | .assets[] | select((.name | startswith("Onyx-")) and (.name | endswith($s)))
                | "\($r.tag_name) \(.name)" ] | first // empty' "$RUNNER_TEMP/releases.json")"
            if [ -z "$found" ]; then
              echo "::warning::Aucune Release precedente ne porte de *-$suffix : la plateforme sera absente."
              continue
            fi
            read -r tag name <<< "$found"
            gh release download "$tag" --repo "$REPO" --pattern "$name" --dir release-assets
            echo "Repris de $tag : $name"
            CARRIED="$CARRIED- \`$name\` (repris de $tag)"$'\n'
          done

          # Le meme paragraphe va dans le resume du run et dans la Release.
          NOTES=""
          if [ -n "$CARRIED" ]; then
            NOTES="## Repris d'une version precedente"$'\n\n'
            NOTES+="Non reconstruits pour cette version : leurs installations ne se mettent pas a jour."$'\n\n'
            NOTES+="$CARRIED"
            printf '%s' "$NOTES" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "notes<<NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Inventaire des installateurs
        run: |
          set -euo pipefail
          ls -lh release-assets
          {
            echo "### Installateurs de la Release"
            echo ""
            echo "| Fichier | Taille |"
            echo "|---|---|"
            for f in release-assets/*; do
              [ -f "$f" ] || continue
              case "$f" in *.gitkeep) continue ;; esac
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Le bundle web est embarque dans le binaire Go via go:embed, il doit donc
      # exister avant le build Docker. Le script porte les reglages non evidents
      # (CanvasKit local, purge des .symbols et de skwasm, pre-compression) :
      # on l'appelle plutot que de les redire ici.
      - name: Build du client Web
        run: bash scripts/build-web.sh

      - uses: docker/setup-buildx-action@v3

      # Le GITHUB_TOKEN du run suffit pour ghcr.io grace a `packages: write` —
      # aucun PAT a creer ni a saisir, contrairement au script local.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          # La version que le serveur annonce sur /api/ping, et d'apres laquelle
          # il choisit la Release dont il propose les installateurs.
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ needs.prepare.outputs.image }}:latest
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version_tag }}
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.minor_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La Release est l'unique entrepot des installateurs : elle les sert a qui
      # n'a pas encore de serveur, et chaque serveur y prend ceux de sa version.
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          # Lance a la main, le tag n'existe pas encore : la Release le cree sur
          # le commit exact qui a ete construit, pas sur la tete de main.
          target_commitish: ${{ github.sha }}
          name: Onyx ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/*.apk
            release-assets/*.ipa
            release-assets/*.ipk
          body: |
            ## Image Docker

            ```
            docker pull ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version_tag }}
            ```

            Tags publies : `latest`, `${{ needs.prepare.outputs.version_tag }}`, `${{ needs.prepare.outputs.minor_tag }}`

            Un serveur en version ${{ needs.prepare.outputs.version }} propose ces
            installateurs sur `/api/downloads` (Parametres -> Applications) : il
            les telecharge ici a la premiere demande.

            ${{ steps.carry.outputs.notes }}
