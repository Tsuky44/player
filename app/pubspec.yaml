name: onyx
description: Onyx — client Direct Play pour un serveur média privé auto-hébergé.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation and routing
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # Network & Persistence
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Téléchargements hors ligne : le dossier privé de l'app où les médias
  # atterrissent, et la manipulation de chemins qui va avec.
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI & Media Kit Packages
  cached_network_image: ^3.3.1
  # Already pulled in by cached_network_image; declared so the app can widen the
  # default 200-file image store (see services/app_image_cache.dart).
  flutter_cache_manager: ^3.4.1
  intl: ^0.19.0
  audio_video_progress_bar: ^2.0.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  
  # Media Player (BasÃ© sur MPV via media-kit)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Desktop window management
  window_manager: ^0.3.7

  # Browser APIs, used only by the web-side conditional imports in lib/utils/
  web: ^1.1.0
  package_info_plus: ^9.0.1

  # Native file dialog, used by the admin to replace the published installers
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0

  # Backlight control for the player's brightness bar. Only the *application*
  # override is used, never the system setting — see services/screen_brightness_control.dart.
  screen_brightness: ^2.1.11
  mobile_scanner: ^7.4.0

  # Le lecteur Android (ExoPlayer dans une SurfaceView). Le paquet ne déclare
  # que la plateforme Android : les builds macOS et Windows ne l'embarquent
  # pas, et rien de leur chaîne de lecture n'est touché.
  onyx_player_android:
    path: ../packages/onyx_player_android

# Les bibliothèques natives de media_kit, avec un FFmpeg complet. Les versions
# publiées embarquent un FFmpeg réduit à une liste blanche de décodeurs sans
# TrueHD : la piste Atmos d'un Blu-ray était muette en Direct Play sur mac,
# Windows et iOS. Seule l'URL du binaire change — voir le Makefile (macOS,
# iOS) ou le CMakeLists.txt (Windows) de chaque paquet sous packages/.
dependency_overrides:
  media_kit_libs_macos_video:
    path: ../packages/media_kit_libs_macos_video
  media_kit_libs_ios_video:
    path: ../packages/media_kit_libs_ios_video
  media_kit_libs_windows_video:
    path: ../packages/media_kit_libs_windows_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Permet aux tests de pointer le stockage hors ligne vers un dossier
  # temporaire plutôt que vers le conteneur applicatif réel.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
