name: project_player_app
description: A lightweight Emby-like media player app focusing on Direct Play.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation and routing
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # Network & Persistence
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI & Media Kit Packages
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  audio_video_progress_bar: ^2.0.3
  flutter_animate: ^4.5.0
  
  # Media Player (Basé sur MPV via media-kit)
  media_kit: 1.1.10
  media_kit_video: 1.2.4
  media_kit_libs_video: 1.0.7

  # Desktop window management
  window_manager: ^0.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
