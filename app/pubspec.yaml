name: onyx
description: Onyx — client Direct Play pour un serveur média privé auto-hébergé.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation and routing
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # Network & Persistence
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Téléchargements hors ligne : le dossier privé de l'app où les médias
  # atterrissent, et la manipulation de chemins qui va avec.
  path_provider: ^2.1.4
  path: ^1.9.0

  # De quel réseau l'appareil dispose — Wi-Fi, Ethernet, données mobiles, rien.
  # Sert au seul arbitrage des téléchargements : un forfait ne paie pas un
  # épisode de 4 Go sans qu'on l'ait demandé. La joignabilité du serveur, elle,
  # continue de se mesurer sur `GET /api/ping` (ADR-0010 §6) — avoir du réseau
  # n'est pas avoir *ce* serveur.
  connectivity_plus: ^7.3.1

  # UI & Media Kit Packages
  cached_network_image: ^4.0.0
  # Already pulled in by cached_network_image; declared so the app can widen the
  # default 200-file image store (see services/app_image_cache.dart).
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  audio_video_progress_bar: ^2.0.3
  flutter_animate: ^4.5.0
  
  # Media Player (BasÃ© sur MPV via media-kit)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Desktop window management
  window_manager: ^0.5.2

  # Browser APIs, used only by the web-side conditional imports in lib/utils/
  web: ^1.1.0
  # Reste en 9 tant que flutter_secure_storage est en 9 : la 10.1+ exige win32
  # 6, et le stockage sécurisé 9 (Windows) win32 5. Les deux montent ensemble.
  package_info_plus: ^9.0.1

  # Native file dialog, used by the admin to replace the published installers
  # Reste en 8 pour la même raison que package_info_plus : la 12 exige win32 6.
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0

  # Backlight control for the player's brightness bar. Only the *application*
  # override is used, never the system setting — see services/screen_brightness_control.dart.
  screen_brightness: ^2.1.11
  # Figé en 7.4.0 : la 7.4.1 ne compile plus ses sources Kotlin quand
  # android.builtInKotlin=false (android/gradle.properties) — la classe du
  # plugin manque au build Android.
  mobile_scanner: 7.4.0

  # Le lecteur Android (ExoPlayer dans une SurfaceView). Le paquet ne déclare
  # que la plateforme Android : les builds macOS et Windows ne l'embarquent
  # pas, et rien de leur chaîne de lecture n'est touché.
  onyx_player_android:
    path: ../packages/onyx_player_android

  # La surface vidéo native de macOS, où mpv dessine lui-même (gpu-next, donc
  # Dolby Vision). Active dès qu'un libmpv patché est installé
  # (native/build_libmpv.sh) — voir lib/utils/mpv_native_view.dart.
  onyx_mpv_macos:
    path: ../packages/onyx_mpv_macos
  # AVPlayer sur iPhone et Mac, pour les fichiers que le serveur peut recopier
  # tels quels en HLS (ADR-0035) : le pipeline vidéo d'Apple chauffe bien moins
  # que mpv. Par l'interface de plateforme, comme sur tvOS ; l'implémentation
  # officielle ne déclare qu'iOS et macOS. 2.9 est la première qui ouvre la vue
  # native (`AVPlayerLayer`) sur les deux, le seul chemin qui garde le HDR.
  video_player_avfoundation: ^2.9.4
  # Garde l'écran allumé pendant une lecture AVPlayer. mpv l'avait sans rien
  # demander : le widget `Video` de media_kit s'en sert (d'où la version, celle
  # que media_kit tire déjà). La vue d'AVPlayer, elle, ne le fait pas.
  wakelock_plus: ^1.1.6

  # --- Apple TV (tvOS) ---------------------------------------------------
  # tvOS se construit avec flutter-tvos (voir l'ADR-0028), qui n'embarque que
  # les plugins déclarant la plateforme `tvos`. Ces paquets sont les portages
  # de fluttertv.dev ; ils ne déclarent que tvOS, donc aucune autre plateforme
  # n'en voit une ligne.
  #
  # Le lecteur : AVPlayer, par l'interface de plateforme de video_player et
  # non par `video_player` lui-même, qui ajouterait son propre ExoPlayer au
  # build Android à côté de celui d'onyx_player_android.
  video_player_platform_interface: ^6.6.0
  video_player_tvos: ^0.0.1
  # Ce dont l'app ne peut pas se passer : réglages, jeton de session, dossiers,
  # cache des affiches (sqflite, via flutter_cache_manager), type de réseau.
  shared_preferences_tvos: ^0.0.2
  flutter_secure_storage_tvos: ^0.0.2
  path_provider_tvos: ^0.0.3
  sqflite_tvos: ^0.0.2
  connectivity_plus_tvos: ^0.0.2
  # Délibérément absents, faute d'objet sur un téléviseur : media_kit (remplacé
  # par AVPlayer), screen_brightness, mobile_scanner, file_picker,
  # window_manager. package_info_plus_tvos exige une interface 4.x incompatible
  # avec le package_info_plus 9 épinglé plus haut : l'hôte tvOS donne la
  # version lui-même (voir ClientIdentity).

# Les bibliothèques natives de media_kit, avec un FFmpeg complet. Les versions
# publiées embarquent un FFmpeg réduit à une liste blanche de décodeurs sans
# TrueHD : la piste Atmos d'un Blu-ray était muette en Direct Play sur mac,
# Windows et iOS. Seule l'URL du binaire change — voir le Makefile (macOS,
# iOS) ou le CMakeLists.txt (Windows) de chaque paquet sous packages/.
dependency_overrides:
  media_kit_libs_macos_video:
    path: ../packages/media_kit_libs_macos_video
  media_kit_libs_ios_video:
    path: ../packages/media_kit_libs_ios_video
  media_kit_libs_windows_video:
    path: ../packages/media_kit_libs_windows_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Permet aux tests de pointer le stockage hors ligne vers un dossier
  # temporaire plutôt que vers le conteneur applicatif réel.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # Manrope est embarquée plutôt que rapatriée au lancement — voir l'ADR-0025.
  # `google_fonts` allait chercher ces mêmes fichiers sur fonts.gstatic.com au
  # premier démarrage, puis les relisait depuis un cache disque à chacun des
  # suivants : une requête réseau et une lecture asynchrone entre l'app et son
  # premier texte, sur une application qui doit démarrer hors ligne.
  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-300.ttf
          weight: 300
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
