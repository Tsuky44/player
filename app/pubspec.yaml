name: onyx
description: Onyx — client Direct Play pour un serveur média privé auto-hébergé.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation and routing
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # Network & Persistence
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI & Media Kit Packages
  cached_network_image: ^3.3.1
  # Already pulled in by cached_network_image; declared so the app can widen the
  # default 200-file image store (see services/app_image_cache.dart).
  flutter_cache_manager: ^3.4.1
  intl: ^0.19.0
  audio_video_progress_bar: ^2.0.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  
  # Media Player (BasÃ© sur MPV via media-kit)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Desktop window management
  window_manager: ^0.3.7

  # Browser APIs, used only by the web-side conditional imports in lib/utils/
  web: ^1.1.0
  package_info_plus: ^9.0.1

  # Native file dialog, used by the admin to replace the published installers
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
