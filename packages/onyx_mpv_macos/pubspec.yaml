name: onyx_mpv_macos
description: >-
  La surface vidéo d'Onyx sur macOS : une vue AppKit dans laquelle libmpv
  dessine lui-même (vo=gpu-next), à la place de la texture de media_kit.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: OnyxMpvMacosPlugin
