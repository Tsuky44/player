version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: onyx-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # Mount your local media folders here.
      # Replace the left-hand side paths with your actual system media paths if different.
      - ./media/Films:/media/Films:ro
      - ./media/Series:/media/Series:ro
    environment:
      - MOVIES_DIR=/media/Films
      - SERIES_DIR=/media/Series
      # Clé API TMDB gratuite (obligatoire pour les affiches) :
      # https://www.themoviedb.org/settings/api
      - TMDB_API_KEY=your_tmdb_api_key_here
      # Langue des titres/synopsis TMDB (films et séries)
      - TMDB_LANGUAGE=fr-FR
      # Nombre maximal d'extractions FFmpeg de sous-titres simultanées
      - SUBTITLE_EXTRACTION_CONCURRENCY=${SUBTITLE_EXTRACTION_CONCURRENCY:-2}
      - MEDIAHUB_URL=${MEDIAHUB_URL:-http://host.docker.internal:3008}
      - MEDIAHUB_API_KEY=${MEDIAHUB_API_KEY:-}
    restart: unless-stopped
