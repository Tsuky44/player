version: '3.8'

services:
  backend:
    image: ghcr.io/tsuky44/playeur-server:latest
    platform: linux/amd64
    container_name: onyx-server
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # --- IMPORTANT : REMPLACEZ LES CHEMINS DE GAUCHE CI-DESSOUS ---
      # Mettez les vrais chemins de votre serveur où sont stockés vos films et séries :
      - /chemin/physique/sur/serveur/Films:/media/Films:ro
      - /chemin/physique/sur/serveur/Series:/media/Series:ro
    environment:
      - MOVIES_DIR=/media/Films
      - SERIES_DIR=/media/Series
      # --- OPTIONNEL : CLE API TMDB ---
      # Ajoutez votre clé API TMDB gratuite ici pour récupérer automatiquement
      # les jaquettes, affiches, résumés de films et séries en français !
      - TMDB_API_KEY=votre_cle_api_tmdb_ici
      - TMDB_LANGUAGE=fr-FR
      # Nombre maximal d'extractions FFmpeg de sous-titres simultanées
      - SUBTITLE_EXTRACTION_CONCURRENCY=${SUBTITLE_EXTRACTION_CONCURRENCY:-2}
      - MEDIAHUB_URL=${MEDIAHUB_URL:-http://mediahub-app:3008}
      - MEDIAHUB_API_KEY=${MEDIAHUB_API_KEY:-}
    restart: unless-stopped
